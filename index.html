<style>
:root{--bg:#faf7f0;--c:#fff;--t:#16120a;--m:#7a7466;--l:#ece6d6;--g:#a9810f;--gs:#a9810f1c;--p:#12924f;--r:#e5484d;--rs:#e5484d1c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#050505;--c:#151517;--t:#f6f2e8;--m:#8f8b80;--l:#26262a;--g:#e3bb55;--gs:#e3bb5522;--p:#3ddc84;--rs:#ff6b6b20;--r:#ff6b6b}}
:root[data-theme="dark"]{--bg:#050505;--c:#151517;--t:#f6f2e8;--m:#8f8b80;--l:#26262a;--g:#e3bb55;--gs:#e3bb5522;--p:#3ddc84;--rs:#ff6b6b20;--r:#ff6b6b}
*{box-sizing:border-box;margin:0}html,body{height:100%}body{background:var(--bg);color:var(--t);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
#app{max-width:560px;margin:auto;padding:16px 16px 100px}
.p{color:var(--p)}.card{background:var(--c);border:1px solid var(--l);border-radius:20px;padding:16px;margin-bottom:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.m{color:var(--m);font-size:13px}.b{font-weight:600}
h2{font-size:13px;color:var(--m);font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin:18px 0 8px}
.big{font-size:34px;font-weight:700;letter-spacing:-.02em}.g{color:var(--g)}.r{color:var(--r)}
.k{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.k .card{padding:12px;margin:0}.k b{display:block;font-size:15px}
.hero{background:linear-gradient(135deg,#f4d77f,#b88c1f);color:#1a1405;border:0;padding:20px}.hero .m{color:#1a1405cc}.av{width:38px;height:38px;border-radius:50%;background:var(--l);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none}.av.g{background:var(--gs)}.li.row>div:first-child{display:flex;gap:12px;align-items:center}.li.row>div:first-child>div{min-width:0}.bar{height:8px;background:var(--l);border-radius:9px;overflow:hidden;margin:8px 0 4px}.bar i{display:block;height:100%;background:var(--g);border-radius:9px}.bar i.o{background:var(--r)}
.li{padding:11px 0;border-bottom:1px solid var(--l)}.li:last-child{border:0}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--gs);color:var(--g)}.tag.o{background:var(--rs);color:var(--r)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:var(--c);border-top:1px solid var(--l);padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--m);padding:4px 8px;min-width:56px;min-height:44px}nav button.on{color:var(--g)}
nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#fab{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;background:var(--g);color:#1a1405;font-size:30px;z-index:6;box-shadow:0 6px 20px #0005}
.btn{background:var(--g);color:#1a1405;font-weight:600;padding:12px 16px;border-radius:12px;width:100%;min-height:46px}.btn.s{background:var(--gs);color:var(--g)}.btn.d{background:var(--rs);color:var(--r)}
.sm{width:auto;padding:6px 12px;min-height:34px;font-size:13px}
input,select{width:100%;background:var(--bg);border:1px solid var(--l);border-radius:12px;padding:12px;min-height:46px;margin:4px 0 10px}
label{font-size:12px;color:var(--m)}label.ck{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--t)}label.ck input{width:20px;min-height:20px;margin:0}
#mod{position:fixed;inset:0;background:#000a;z-index:20;display:none;align-items:flex-end;justify-content:center}#mod.on{display:flex}
#sheet{background:var(--c);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.seg{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}.seg button{padding:8px 14px;border-radius:99px;background:var(--bg);border:1px solid var(--l);white-space:nowrap;font-size:13px}.seg button.on{background:var(--g);color:#1a1405;border-color:var(--g)}
.mn{display:flex;align-items:center;gap:8px}.mn button{width:36px;height:36px;border-radius:50%;background:var(--c);border:1px solid var(--l)}
svg.ch{width:100%;height:120px;display:block}
@media(min-width:900px){#app{max-width:1100px;padding:28px 32px 40px 240px}nav{top:0;right:auto;bottom:auto;width:208px;flex-direction:column;justify-content:flex-start;gap:6px;padding:24px 12px;border-top:0;border-right:1px solid var(--l)}nav button{flex-direction:row;gap:12px;font-size:14px;padding:12px;width:100%;justify-content:flex-start;border-radius:12px}nav button.on{background:var(--gs)}#fab{bottom:28px;right:32px}#sheet{border-radius:20px;margin:auto;max-width:480px}#mod{align-items:center}.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}.g2>div>.card:last-child{margin-bottom:0}}
#auth{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;align-items:center;justify-content:center;padding:16px}#auth .card{width:100%;max-width:380px}.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}.qa button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--m)}.qa i{width:54px;height:54px;border-radius:50%;background:var(--c);border:1px solid var(--l);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:24px;color:var(--g)}.acs{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px}.acs>div{flex:none;min-width:132px;background:var(--c);border:1px solid var(--l);border-radius:16px;padding:12px}.dg{display:flex;gap:16px;align-items:center}.dg svg{width:120px;flex:none}.dg>div{flex:1;min-width:0}
html{scroll-behavior:smooth}body{overscroll-behavior-y:none}#app{padding-bottom:130px}
.hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;margin:0 -16px 14px;padding:12px 16px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.sp{height:10px}.btn{margin-top:4px}.btn.sm{margin:10px 8px 0 0}.card>.btn{margin-top:12px}
label{display:block;margin-top:2px}label.ck{margin:6px 0 18px;padding:12px 14px;background:var(--bg);border:1px solid var(--l);border-radius:12px;min-height:48px}
#err{min-height:20px;margin-bottom:8px;font-size:13px}#sheet .btn{margin-top:8px}#sheet{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.ac{display:flex;gap:14px;justify-content:flex-end;flex-wrap:wrap;margin-top:2px}.ac button{padding:6px 0;font-size:13px;min-height:32px}
.li.row>div:last-child{flex:none;text-align:right}.big{font-size:clamp(28px,8vw,36px)}.row.li{padding:12px 0}
.seg,.acs{scroll-snap-type:x proximity;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-bottom:2px}.seg::-webkit-scrollbar,.acs::-webkit-scrollbar{display:none}.acs>div,.seg>button{scroll-snap-align:start}
@keyframes up{from{opacity:0;transform:translateY(14px)}}@keyframes grow{from{transform:scaleX(0)}}@keyframes sl{from{opacity:0;transform:translateY(40px)}}@keyframes fd{from{opacity:0}}@keyframes pop{from{opacity:0;transform:scale(.6)}}@keyframes rot{from{opacity:0;transform:rotate(-60deg) scale(.85)}}
.an>*{animation:up .45s cubic-bezier(.2,.8,.2,1) both}.an>*:nth-child(2){animation-delay:.05s}.an>*:nth-child(3){animation-delay:.1s}.an>*:nth-child(4){animation-delay:.15s}.an>*:nth-child(5){animation-delay:.2s}.an>*:nth-child(n+6){animation-delay:.25s}
.an .bar i{transform-origin:left;animation:grow .8s .2s cubic-bezier(.2,.8,.2,1) both}.an .dg svg{animation:rot .9s .15s cubic-bezier(.2,.8,.2,1) both}.an svg.ch{animation:fd .8s .2s both}
#mod.on{animation:fd .2s both}#mod.on #sheet{animation:sl .32s cubic-bezier(.2,.8,.2,1)}#fab{animation:pop .5s .3s cubic-bezier(.3,1.4,.5,1) both;transition:transform .2s}#fab:active{transform:scale(.9) rotate(90deg)}
button,.card[onclick]{transition:transform .15s,background .2s}button:active,.card[onclick]:active{transform:scale(.97)}nav button svg{transition:transform .25s}nav button.on svg{transform:translateY(-2px) scale(1.12)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

input,select{min-width:0;max-width:100%;display:block;-webkit-appearance:none;appearance:none}input[type=date]{min-height:48px;text-align:left;line-height:1.2}input[type=date]::-webkit-date-and-time-value{text-align:left;margin:0;min-width:0}input[type=date]::-webkit-calendar-picker-indicator{opacity:.7}
select{background-image:linear-gradient(45deg,transparent 50%,var(--m) 50%),linear-gradient(135deg,var(--m) 50%,transparent 50%);background-position:calc(100% - 20px) 21px,calc(100% - 15px) 21px;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
#sheet{overflow-x:hidden}#sheet *{max-width:100%}
.hero{position:relative;overflow:hidden}.hero:after{content:"";position:absolute;top:0;left:-60%;width:35%;height:100%;background:linear-gradient(100deg,transparent,#ffffff55,transparent);transform:skewX(-20deg);animation:shine 5s 1.2s infinite;pointer-events:none}
@keyframes shine{0%{left:-60%}30%,100%{left:140%}}@keyframes glow{50%{box-shadow:0 6px 30px #e3bb5566}}
#fab{animation:pop .5s .3s cubic-bezier(.3,1.4,.5,1) both,glow 3.2s 1.2s ease-in-out infinite}
#sheet.fresh>*{animation:up .4s cubic-bezier(.2,.8,.2,1) both}#sheet.fresh>*:nth-child(2){animation-delay:.04s}#sheet.fresh>*:nth-child(3){animation-delay:.08s}#sheet.fresh>*:nth-child(4){animation-delay:.12s}#sheet.fresh>*:nth-child(n+5){animation-delay:.16s}
.an .li{animation:up .4s cubic-bezier(.2,.8,.2,1) both}.an .li:nth-child(2){animation-delay:.08s}.an .li:nth-child(3){animation-delay:.14s}.an .li:nth-child(4){animation-delay:.2s}.an .li:nth-child(n+5){animation-delay:.26s}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--g);color:#1a1405;font-weight:600;padding:12px 20px;border-radius:99px;opacity:0;pointer-events:none;transition:.35s cubic-bezier(.2,.8,.2,1);z-index:30;white-space:nowrap}#toast.on{opacity:1;transform:translate(-50%,0)}
@media(hover:hover){.card[onclick]:hover,.qa button:hover i{transform:translateY(-2px);border-color:var(--g)}}

.card,.qa,.acs,.seg{margin-bottom:16px}.card{padding:16px}.g2{gap:16px}.hd{margin-bottom:16px}h2{margin:16px 0 12px}#app>.btn{margin:0 0 16px}
.card>.btn{margin-top:16px}.hero{padding:20px}.li{padding:12px 0}
.acs{gap:12px}.acs>div{display:flex;flex-direction:column;gap:8px;padding:16px;min-width:150px}.acs b{font-size:17px}
.hero:after{animation:shine 11s 1.5s infinite}@keyframes shine{0%{left:-60%}45%,100%{left:140%}}

.gb{width:36px;height:36px;border-radius:50%;background:var(--c);border:1px solid var(--l);display:inline-flex;align-items:center;justify-content:center;color:var(--t)}.gb svg,.mn button svg{width:18px;height:18px}.mn button{display:inline-flex;align-items:center;justify-content:center}.card>.btn:first-child{margin-top:0}.hero .hn{color:#7a0f12}.li.row[onclick]{cursor:pointer}[data-calm="1"] *,[data-calm="1"] *:after{animation:none!important;transition:none!important}


.hero{padding:24px 20px}.hero .m{font-size:13px;letter-spacing:.04em}.hero .big{font-size:clamp(40px,12.5vw,54px);font-weight:800;letter-spacing:-.035em;line-height:1.05;margin:6px 0 2px}.hero .kp{background:#1a14051f;border-radius:14px;padding:12px 14px;margin-top:18px}.hero .hn,.hero .big.hn{color:#7a0f12}
.ins{border-left:3px solid var(--g)}.ins p{margin-top:8px}
.k3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}.k3 b{display:block;font-size:15px;margin-top:4px;white-space:nowrap}
.gauge .v{stroke-dasharray:276.5}.an .gauge .v{animation:gauge 1.9s .3s cubic-bezier(.2,.8,.2,1) both}@keyframes gauge{from{stroke-dashoffset:276.5}}
.bars rect{transform-box:fill-box;transform-origin:bottom}.an .bars rect{animation:sy .9s .2s cubic-bezier(.2,.8,.2,1) both}@keyframes sy{from{transform:scaleY(0)}}
#splash{position:fixed;inset:0;background:#000;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;animation:out .7s 2.3s cubic-bezier(.4,0,.2,1) forwards}
#lg{display:flex;align-items:center;gap:4%;width:min(78vw,300px);animation:lgo .7s 2.3s cubic-bezier(.4,0,.2,1) forwards}#lg img{display:block;height:auto}
.mk{width:22%;animation:mk 1.1s .15s cubic-bezier(.16,1,.3,1) both}.wd{width:74%;animation:wd 1.1s .55s cubic-bezier(.16,1,.3,1) both}
.sl{height:1px;width:0;margin-top:28px;background:linear-gradient(90deg,transparent,#e3bb5599,transparent);animation:ln 1.2s 1.1s cubic-bezier(.16,1,.3,1) forwards}
@keyframes mk{from{opacity:0;transform:scale(.92);filter:blur(8px)}}@keyframes wd{from{opacity:0;transform:translateY(8px);filter:blur(6px)}}@keyframes ln{to{width:min(48vw,160px)}}@keyframes lgo{to{opacity:0;transform:scale(1.04);filter:blur(4px)}}@keyframes out{to{opacity:0;visibility:hidden}}
@media(prefers-reduced-motion:reduce){#splash{display:none}}[data-calm="1"] #splash{display:none}

.bl{position:relative}.bg{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--g);color:#1a1405;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;animation:pop .4s cubic-bezier(.3,1.4,.5,1) both}
.nt{display:grid;grid-template-columns:44px 1fr 24px;gap:14px;align-items:start;cursor:pointer}.nt img{width:44px;height:44px;padding:9px;border-radius:50%;background:var(--gs);object-fit:contain}.nt p{margin:2px 0 6px}.nt.un{border-left:3px solid var(--g)}.nt:not(.un){opacity:.7}.nt>button{font-size:22px;line-height:1;color:var(--m)}

.card{overflow:hidden}.big,.kp b,.k3 b,.acs b{display:block;overflow:hidden;white-space:nowrap}
.hero .kp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.kp>div,.k3>div{min-width:0}.row.m{flex-wrap:wrap;gap:4px 12px}
.li.row .b{overflow-wrap:anywhere}.li.row>div:last-child b{white-space:nowrap}.dg .row span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ni{width:44px;height:44px;border-radius:50%;background:var(--mk) center/100% no-repeat,var(--gs)}.nt>button{display:flex;align-items:center;justify-content:center;width:24px;height:24px;padding:0 0 2px}
#fab{display:flex;align-items:center;justify-content:center;padding:0 0 3px;line-height:1}.qa i{line-height:1;padding-bottom:2px}.mn button:not(:has(svg)){line-height:1;padding-bottom:3px}
#auth .card>.b,#auth .card>p.m,#ar{text-align:center}

#mod{z-index:60}.tr{cursor:pointer}.tr>div:first-child{min-width:0;flex:1}.amt{flex:none;white-space:nowrap;margin-left:12px}

function proj(m){let b=saldo();S.tx.forEach(x=>{if(x.date>m+'-31'||x.card||real(x))return;if(x.type=='r')b+=x.val;else if(x.type=='d')b-=x.val});S.cards.forEach(c=>{const t=sum(S.tx.filter(x=>x.card==c.id&&x.type=='d'&&invM(x)==m))-sum((S.pays||[]).filter(p=>p.card==c.id&&p.m==m));if(t>0)b-=t});return b}
function flow(m){const st=m+'-01',en=m+'-31';let ini=S.accs.reduce((s,a)=>s+a.bal,0),e=0,o=0,iv=0;S.tx.forEach(x=>{if(x.card||x.type=='t'||!real(x))return;const v=x.type=='r'?x.val:-x.val;if(x.date<st)ini+=v;else if(x.date<=en){if(x.type=='r')e+=x.val;else if(x.type=='d')o+=x.val;else iv+=x.val}});(S.pays||[]).forEach(p=>{if(p.date<st)ini-=p.val;else if(p.date<=en)o+=p.val});return{ini,e,o,iv,fim:ini+e-o-iv}}

function comp(){const l=mt(M).filter(x=>x.type=='d'&&x.val>0),pr=/\(\d+\/\d+\)$/,fix=sum(l.filter(x=>x.rec&&!pr.test(x.desc))),par=sum(l.filter(x=>pr.test(x.desc))),cav=sum(l.filter(x=>x.card&&!x.rec&&!pr.test(x.desc))),deb=(S.debts||[]).filter(d=>d.orig>d.pago).reduce((s,d)=>s+d.vp,0),rd=rec(M),tot=fix+par+cav+deb,row=(n,v)=>`<div class="li row"><span>${n}</span><b>${R(v)}</b></div>`;

function fstat(c,m,t){const pd=sum((S.pays||[]).filter(p=>p.card==c.id&&p.m==m)),rest=t-pd,s=t<=0?'Sem compras':rest<=0.005?'Paga':(m+'-'+p2(c.due))<today?'Vencida':today>m+'-'+p2(c.close)?'Fechada':'Aberta';return`<div class="row" style="margin:8px 0"><span class="tag ${s=='Vencida'?'o':''}">${s}</span>${pd>0?`<span class="m">Pago ${R(pd)}</span>`:''}${rest>0.005?`<button class="btn s sm" onclick="payF('${c.id}','${m}')">Pagar fatura</button>`:''}</div>`}

function dividas(){const l=S.debts||[],o=sum(l.map(d=>({val:d.orig}))),p=sum(l.map(d=>({val:d.pago}))),r=Math.max(0,o-p),mm=l.filter(d=>d.orig>d.pago).reduce((s,d)=>s+d.vp,0);return`<h2>Dívidas</h2><div class="card"><div class="k3"><div><div class="m">Total</div><b>${R(o)}</b></div><div><div class="m">Pago</div><b class="p">${R(p)}</b></div><div><div class="m">Restante</div><b class="${r?'r':''}">${R(r)}</b></div></div><div class="row m"><span>Comprometimento mensal</span><b>${R(mm)}</b></div>${l.map(d=>{const pc=Math.min(100,d.pago/d.orig*100);return`<div class="li"><div class="row"><b>${d.cred}</b><span class="m">${d.vp>0?Math.max(0,Math.ceil((d.orig-d.pago)/d.vp))+' parcelas restantes':''}</span></div><div class="bar"><i style="width:${pc}%"></i></div><div class="row m"><span>Restante ${R(Math.max(0,d.orig-d.pago))}</span><button class="g b" onclick="debtPay('${d.id}')">pagar parcela</button></div></div>`}).join('')}<button class="btn s sm" onclick="newDebt()">Nova dívida</button></div>`}
function newDebt(){form('Nova dívida',[{k:'cred',l:'Credor',req:1},{k:'orig',l:'Valor total (com juros)',t:'number',req:1},{k:'pago',l:'Já pago (R$)',t:'number'},{k:'vp',l:'Valor da parcela',t:'number',req:1},{k:'parc',l:'Número de parcelas',t:'number'},{k:'juros',l:'Juros (% ao mês, opcional)',t:'number'}],v=>{S.debts=S.debts||[];S.debts.push({id:uid(),cred:v.cred,orig:v.orig,pago:v.pago||0,vp:v.vp,parc:v.parc||0,juros:v.juros||0})})}
